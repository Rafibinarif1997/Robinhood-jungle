name: Build and browser test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Restore Vite source entry
        run: cp src/index.template.html index.html
      - name: Build application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Publish built site to repository root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf assets
          cp -a dist/. .
          git add -f index.html assets
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish static game to main root for GitHub Pages"
            git push
          fi
