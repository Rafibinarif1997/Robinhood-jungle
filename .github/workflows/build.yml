name: Build and browser test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/3d-jungle-prototype]

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jungle-playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
