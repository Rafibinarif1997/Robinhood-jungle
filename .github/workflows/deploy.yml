
name: Deploy ETH Jungle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      

      - name: Check Supabase variable availability
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            echo "SUPABASE_URL_PRESENT=true"
          else
            echo "SUPABASE_URL_PRESENT=false"
          fi

          if [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_KEY_PRESENT=true"
          else
            echo "SUPABASE_KEY_PRESENT=false"
          fi

      - run: npm install
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
